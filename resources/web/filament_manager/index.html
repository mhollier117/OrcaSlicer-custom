<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filament Manager</title>
    
  </head>
  <body>
    <script>
      // Pick the theme BEFORE first paint (no flash): the `theme` query
      // parameter (?theme=dark or ?theme=light) wins, otherwise the
      // prefers-color-scheme media query. Both directions are set explicitly
      // so selectors that only cover one direction still resolve correctly.
      // The host's later init response / init/theme_changed report still
      // override this through the store.
      (function () {
        var theme = null;
        try {
          var m = /[?&]theme=(dark|light)(?:&|#|$)/i.exec(window.location.search);
          if (m) theme = m[1].toLowerCase();
        } catch (e) {}
        if (!theme) {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
      // Disable Ctrl+wheel / Ctrl+plus / Ctrl+minus zoom in WebView2
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) { e.preventDefault(); }
      }, { passive: false });
    </script>
    <div id="root"></div>
      <script src="./assets/index.js"></script>
  </body>
</html>
